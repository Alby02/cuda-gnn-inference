[project]
name = "cuda-gnn-inference-tools"
version = "0.1.0"
description = "Dataset preparation tools for the CUDA GNN inference project"
requires-python = ">=3.10,<3.14"
dependencies = [
  "networkit>=11.2",
  "numpy>=1.24",
  "ogb>=1.3",
  "scipy>=1.10",
  "torch>=2.0",
  "torch-geometric>=2.4",
]

[tool.uv]
package = false
